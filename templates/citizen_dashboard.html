{% extends 'base.html' %}
{% block title %}Citizen Dashboard - CivicFix{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <span class="fs-1">👤</span>
                        <h2 class="fw-bold mt-2">Citizen Dashboard</h2>
                        <p class="text-muted">Welcome back, <span class="text-dark fw-semibold">{{ user.username }}</span>!</p>
                    </div>

                    <hr class="my-4 text-muted opacity-25">

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                        <a href="{% url 'submit_complaint' %}" class="btn btn-primary d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-plus-circle"></i> Submit New Complaint
                        </a>

                        <a href="{% url 'view_complaints' %}" class="btn btn-outline-primary d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-list-ul"></i> View My Complaints
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
